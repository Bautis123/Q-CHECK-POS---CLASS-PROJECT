<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Q-CHECK POS</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="login-page">
    <main id="login-screen" class="login-shell">
      <section class="login-panel">
        <div>
          <p class="eyebrow">Q-CHECK POS</p>
          <h1>Q-CHECK POS</h1>
          <p class="muted">Retail Console</p>
        </div>
        <form id="login-form" class="form-stack">
          <label>
            Username
            <input id="login-username" type="text" placeholder="Enter your username" autocomplete="username" required>
          </label>
          <label>
            Password
            <input id="login-password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
          </label>
          <p id="login-error" class="form-error" role="alert" aria-live="assertive" hidden>Invalid username or password.</p>
          <p class="login-help">Contact an administrator if you need help accessing your account.</p>
          <button class="btn primary" type="submit">Sign In</button>
        </form>
        <p class="login-footer">&copy; 2026 Q-CHECK POS. All rights reserved.</p>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
