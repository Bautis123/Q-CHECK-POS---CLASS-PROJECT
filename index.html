<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Electronic Gadget POS</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="login-page">
    <main id="login-screen" class="login-shell">
      <section class="login-panel">
        <div>
          <p class="eyebrow">Electronic Gadget POS</p>
          <h1>Q-Check Store POS</h1>
          <p class="muted">Retail Console</p>
        </div>
        <form id="login-form" class="form-stack">
          <label>
            Username
            <input id="login-username" type="text" placeholder="Enter your username" autocomplete="username">
          </label>
          <label>
            Password
            <input id="login-password" type="password" placeholder="Enter your password" autocomplete="current-password">
          </label>
          <p id="login-error" class="form-error" hidden>Invalid username or password.</p>
          <div class="login-options">
            <label class="check-row"><input type="checkbox"> Remember me</label>
            <button class="link-button" type="button">Forgot password?</button>
          </div>
          <button class="btn primary" type="submit">Sign In</button>
        </form>
        <p class="login-footer">&copy; 2026 Gadget POS. All rights reserved.</p>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
